name: Nonpublished observation photo candidates

on:
  pull_request:
    paths:
      - '.github/workflows/observation-photo-candidates.yml'
      - 'scripts/build-observation-photo-candidates.py'
      - 'tests/test_observation_photo_candidates.py'
      - 'docs/OBSERVATION-ART-REPLACEMENT-BRIEFS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0
      - name: Assert independent original-photo and delta constraints
        run: python -m unittest discover -s tests -p 'test_observation_photo_candidates.py' -v
      - name: Generate source-only candidate assets (never overwrite production)
        run: python scripts/build-observation-photo-candidates.py --output-dir docs/qa-observation-candidates
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observation-photo-candidates-not-for-production
          path: docs/qa-observation-candidates/
          retention-days: 30
