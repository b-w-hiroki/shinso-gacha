name: WebKit SSR stability (daily)

on:
  schedule:
    # Daily reproducibility check; scheduled GitHub Actions may start late.
    - cron: '23 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/webkit-ssr-stability.yml'
      - 'tests/observation-lowlight-isolated.cjs'
      - 'tests/observation-location-variants.cjs'
      - 'scripts/webkit-ssr-stability.mjs'
      - 'tests/webkit-ssr-stability-runner.cjs'
      - 'assets/observation.js'
      - 'assets/observation.css'
      - 'assets/observation-location-model.js'
      - 'assets/observation/ssr-composites/**'
      - 'scripts/build-ssr-composites.py'
      - 'assets/observation/photo-deltas/**'
      - 'assets/observation/alt-overlays/**'

permissions:
  contents: read

concurrency:
  group: webkit-ssr-stability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  webkit-ssr-replay:
    name: WebKit SSR repeat (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [photo, dash]
    env:
      QA_WEBKIT: '1'
      QA_OBSERVATION_MODE: ${{ matrix.mode }}
      QA_SOURCE_ONLY: '1'
      QA_LOWLIGHT_ISOLATED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps webkit
      - name: Capture every independent pointer/photo attempt and fail on any regression
        run: node scripts/webkit-ssr-stability.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-stability-${{ matrix.mode }}
          path: docs/qa-webkit-stability/
          retention-days: 30
