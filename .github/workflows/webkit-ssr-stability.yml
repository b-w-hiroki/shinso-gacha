name: WebKit SSR stability (daily)

on:
  schedule:
    # Daily reproducibility check; scheduled GitHub Actions may start late.
    - cron: '23 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/webkit-ssr-stability.yml'
      - 'tests/observation-lowlight-isolated.cjs'
      - 'tests/observation-location-variants.cjs'

permissions:
  contents: read

concurrency:
  group: webkit-ssr-stability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  webkit-ssr-replay:
    name: WebKit SSR repeat (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [photo, dash]
    env:
      QA_WEBKIT: '1'
      QA_OBSERVATION_MODE: ${{ matrix.mode }}
      QA_SOURCE_ONLY: '1'
      QA_LOWLIGHT_ISOLATED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps webkit
      - name: Independent real-pointer low-light and zoom trials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/qa-webkit-stability
          printf 'sha=%s\nmode=%s\nrun=%s\n' "$GITHUB_SHA" "$QA_OBSERVATION_MODE" "$GITHUB_RUN_ID" > docs/qa-webkit-stability/run.txt
          # First failures stay failures: do not retry failed attempts.
          for attempt in 1 2 3; do
            echo "lowlight trial=${attempt} mode=$QA_OBSERVATION_MODE" | tee -a docs/qa-webkit-stability/run.txt
            node tests/observation-lowlight-isolated.cjs 2>&1 | tee -a docs/qa-webkit-stability/run.txt
          done
      - name: Independent WebKit photo rarity and repeated SSR trials
        shell: bash
        run: |
          set -euo pipefail
          for rarity in 0 1 2 3 3 3 3; do
            echo "rarity=${rarity} mode=$QA_OBSERVATION_MODE" | tee -a docs/qa-webkit-stability/run.txt
            QA_OBSERVATION_RARITY="$rarity" node tests/observation-location-variants.cjs 2>&1 | tee -a docs/qa-webkit-stability/run.txt
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-stability-${{ matrix.mode }}
          path: docs/qa-webkit-stability/
          retention-days: 30
