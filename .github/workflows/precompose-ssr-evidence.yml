name: Precompose SSR evidence (trusted branch)

on:
  push:
    branches:
      - fix/ssr-single-composite-20261015
    paths:
      - .github/workflows/precompose-ssr-evidence.yml
      - scripts/build-ssr-composites.py

permissions:
  contents: write

concurrency:
  group: precompose-ssr
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==12.0.0' 'CairoSVG==2.8.2'
      - run: python scripts/build-ssr-composites.py
      - run: python scripts/build-ssr-composites.py --check
      - name: Commit derived pixels only to this explicitly scoped working branch
        shell: bash
        run: |
          set -euo pipefail
          git add assets/observation/ssr-composites docs/qa-incursions/ssr-composite-build.json
          if git diff --cached --quiet; then
            echo "No derived artifact changes"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(assets): precompose 4 SSR photos from existing evidence masters'
          git push origin "HEAD:$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: precomposed-ssr-source-report
          path: |
            docs/qa-incursions/ssr-composite-build.json
            assets/observation/ssr-composites/
          retention-days: 30
