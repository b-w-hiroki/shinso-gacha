name: Generated observation ZIP preflight (read-only)

on:
  pull_request:
    paths:
      - '.github/workflows/generated-observation-zip-check.yml'
      - 'scripts/import-generated-observation.py'
      - 'tests/test_import_generated_observation.py'
      - 'tests/observation-photo-asset-audit.cjs'
      - 'docs/OBSERVATION-ART-REPLACEMENT-BRIEFS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-import-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0
      - name: Verify generated binary archive validation and security guards
        run: python -m unittest discover -s tests -p 'test_import_generated_observation.py' -v
      - name: Ensure existing CC0 sources and binaries still pass strict audit
        run: node tests/observation-photo-asset-audit.cjs
