name: observation-art-candidate
on:
  push:
    branches: [feat/observation-native-art-20261012]
    paths:
      - '.github/workflows/observation-art-candidate.yml'
      - 'docs/observation-native-sources.json'
      - 'scripts/build_observation_native.py'
permissions:
  contents: write
jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Render four source-resolution CC0 candidates
        run: python scripts/build_observation_native.py
      - name: Commit candidate binaries to this feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/observation/*-native.webp docs/qa-incursions/native-photo-source-report.json docs/qa-incursions/native-photo-board.jpg
          git commit -m "art: stage four reviewed-source native observation images"
          git push origin HEAD:feat/observation-native-art-20261012
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observation-art-candidates
          path: |
            assets/observation/*-native.webp
            docs/qa-incursions/native-photo-source-report.json
            docs/qa-incursions/native-photo-board.jpg
