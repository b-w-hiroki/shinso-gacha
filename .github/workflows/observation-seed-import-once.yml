name: One-time observation candidate seed import

on:
  push:
    branches: [feat/observation-night-photo-candidates-20261016]

permissions:
  contents: write
  actions: read

jobs:
  import-seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Import previously generated and hash-verified candidate masters
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/photo-seeds"
          gh run download 38827900984 -R "$GITHUB_REPOSITORY" \
            -n observation-photo-candidates-not-for-production \
            -D "$RUNNER_TEMP/photo-seeds"
          echo '492d17646afe750ffec4995c70a9148b98d9b13e9aa56c85aa5804f1aed8d087  '"$RUNNER_TEMP/photo-seeds/photo-native-candidate.webp" | sha256sum -c -
          mkdir -p assets/observation/candidate-sources
          cp "$RUNNER_TEMP/photo-seeds/photo-native-candidate.webp" assets/observation/candidate-sources/photo-room-cc0-graded-seed.webp
          cp "$RUNNER_TEMP/photo-seeds/dash-native-candidate.webp" assets/observation/candidate-sources/dash-legacy-front-graded-seed.webp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/observation/candidate-sources/
          if git diff --cached --quiet; then
            echo "Candidate seed assets already match, nothing to update"
            exit 0
          fi
          git commit -m "assets: preserve source-derived candidate WebP seeds with verified provenance"
          git push origin HEAD:feat/observation-night-photo-candidates-20261016
