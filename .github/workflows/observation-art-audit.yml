name: Observation artwork comparison (source only)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/observation-art-audit.yml'
      - 'scripts/observation-visual-audit.py'
      - 'tests/test_observation_visual_audit.py'
      - 'assets/observation/**'
      - 'assets/observation-location-model.js'
      - 'docs/OBSERVATION-ART-REPLACEMENT-BRIEFS.md'

permissions:
  contents: read

jobs:
  observation-art-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned raster and SVG decoders
        run: python -m pip install Pillow==12.0.0 CairoSVG==2.8.2
      - name: Verify audit calculations without production fixtures
        run: python -m unittest discover -s tests -p 'test_observation_visual_audit.py' -v
      - name: Verify all 12 original image-space hotspots
        run: node tests/observation-overlay-art.cjs && node tests/observation-photo-asset-audit.cjs
      - name: Render source-only 4x4 contact sheet and difference metrics
        run: python scripts/observation-visual-audit.py --output-dir docs/qa-observation-assets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observation-art-4x4-source-comparison
          path: docs/qa-observation-assets/
          retention-days: 30
