name: smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/smoke.mjs
      - run: node tests/documentation-contract.cjs
      - run: node tests/clearance-risk.cjs
      - run: node tests/personnel-discrepancies-model.cjs
      - run: node tests/incursion-rarity.cjs
      - run: node tests/rumor-patrol-model.cjs
      - run: node tests/legend-model.cjs
      - run: node tests/legend-layers.cjs
      - run: node tests/uncanny-archive.cjs
      - run: node tests/investigation-links.cjs
      - run: node tests/research-reports-model.cjs
      - run: node tests/reality-clues.cjs
      - run: node tests/absence-traces.cjs
      - run: node tests/forecast-archive.cjs
      - run: node tests/witness-registry-model.cjs
      - run: node tests/forecast-followup-model.cjs
      - run: node tests/forecast-chain-model.cjs
      - run: node tests/player-seepage-model.cjs
      - run: node tests/observation-model.cjs
      - run: node tests/observation-longterm.cjs
      - run: node tests/observation-location-model.cjs
      - run: node tests/observation-overlay-art.cjs
      - run: node tests/observation-site-targets.cjs
      - run: node tests/observation-photo-asset-audit.cjs
      - run: node tests/observation-single-master-delta.cjs
      - run: node tests/observation-photo-deltas.cjs
      - run: node tests/photo-verso-model.cjs
      - run: node tests/observation-zoom.cjs
      - run: node tests/location-correlations-model.cjs
      - run: node tests/contamination-model.cjs
      - run: node scripts/update-csp.cjs --check
      - run: node tests/runtime-safety.cjs
      - run: node tests/cloud-save.cjs
      - run: node tests/branch-cleanup.mjs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Japanese font for reproducible offline screenshots
        run: curl --fail --location --retry 2 --output "$RUNNER_TEMP/noto.otf" https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf
      - run: node tests/photoreal.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/dossier-ui.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/intro.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/incursions.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/incursion-growth.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/tap-rewards.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/observation.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/observation-location-variants.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - name: Measure observation visual differences (diagnostic only)
        run: node tests/observation-visibility-metrics.cjs
      - run: node tests/photo-verso.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/location-correlations.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/observation-blind.cjs
      - run: node tests/contamination-ui.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/conversation-pages.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/personnel-discrepancies.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/menu-pages.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/investigation-loop.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/research-reports.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/anomaly-cues.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/account-catalog.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/rumor-patrol.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/legend-cases.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/forecast-followup.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/witness-registry.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/player-seepage.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/quieter-loop.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/incursion-records.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/incursion-images.cjs
      - run: node tests/incursion-experiences.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/incursion-catalog.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/opening-reading.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/scene-fit-variety.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/screen-purpose.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/patrol-ui.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/information-ui.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/layout.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photoreal-browser-qa
          path: |
            docs/qa/
            docs/qa-ui/
            docs/qa-intro/
            docs/qa-incursions/

  webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps webkit
      - name: Japanese font
        run: curl --fail --location --retry 2 --output "$RUNNER_TEMP/noto.otf" https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf
      - run: node tests/account-catalog.cjs
        env:
          QA_WEBKIT: 1
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/rumor-patrol.cjs
        env:
          QA_WEBKIT: 1
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/photo-verso.cjs
        env:
          QA_WEBKIT: 1
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/location-correlations.cjs
        env:
          QA_WEBKIT: 1
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/observation-blind.cjs
        env:
          QA_WEBKIT: 1
      - run: node tests/legend-cases.cjs
        env:
          QA_WEBKIT: 1
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/research-reports.cjs
        env:
          QA_WEBKIT: 1
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/forecast-followup.cjs
        env:
          QA_WEBKIT: 1
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/witness-registry.cjs
        env:
          QA_WEBKIT: 1
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/personnel-discrepancies.cjs
        env:
          QA_WEBKIT: 1
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: xvfb-run -a node tests/player-seepage.cjs
        env:
          QA_HEADED: 1
          QA_WEBKIT: 1
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/quieter-loop.cjs
        env:
          QA_WEBKIT: 1
          QA_FONT: ${{ runner.temp }}/noto.otf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-loop-qa
          path: docs/qa-incursions/

  # Four photographic sources are tested on independent runners, not only
  # fresh browser processes: WebKit's filtered 1440px photo compositing can
  # retain GPU/memory state across otherwise isolated browser invocations.
  # Every source still verifies low-light/zoom input AND all four rarity states.
  webkit-photo-matrix:
    name: WebKit photographic QA (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [cctv, photo, vision, dash]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps webkit
      - name: Japanese font
        run: curl --fail --location --retry 2 --output "$RUNNER_TEMP/noto.otf" https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf
      - name: Real low-light and zoom pointer QA
        run: node tests/observation-lowlight-isolated.cjs
        env:
          QA_WEBKIT: 1
          QA_OBSERVATION_MODE: ${{ matrix.mode }}
          QA_FONT: ${{ runner.temp }}/noto.otf
      - name: Source photo, native WebP, four rarities and real hotspot QA
        shell: bash
        run: |
          set -euo pipefail
          for rarity in 0 1 2 3; do
            QA_OBSERVATION_RARITY="$rarity" node tests/observation-location-variants.cjs
          done
        env:
          QA_WEBKIT: 1
          QA_OBSERVATION_MODE: ${{ matrix.mode }}
          QA_LOWLIGHT_ISOLATED: 1
          QA_FONT: ${{ runner.temp }}/noto.otf

  security-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-save --package-lock=false firebase-tools@14.20.0 @firebase/rules-unit-testing@4.0.1 firebase@11.10.0
      - run: npx firebase emulators:exec --only firestore --project demo-shinso-security 'node tests/firestore-rules.cjs && node tests/firestore-multidevice.cjs'
