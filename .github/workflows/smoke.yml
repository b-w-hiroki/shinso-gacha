name: smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/smoke.mjs
      - run: node tests/incursion-rarity.cjs
      - run: node tests/rumor-patrol-model.cjs
      - run: node tests/legend-model.cjs
      - run: node tests/legend-layers.cjs
      - run: node tests/uncanny-archive.cjs
      - run: node tests/investigation-links.cjs
      - run: node tests/reality-clues.cjs
      - run: node tests/absence-traces.cjs
      - run: node tests/player-seepage-model.cjs
      - run: node tests/observation-model.cjs
      - run: node tests/contamination-model.cjs
      - run: node scripts/update-csp.cjs --check
      - run: node tests/runtime-safety.cjs
      - run: node tests/cloud-save.cjs
      - run: node tests/branch-cleanup.mjs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Japanese font for reproducible offline screenshots
        run: curl --fail --location --retry 2 --output "$RUNNER_TEMP/noto.otf" https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf
      - run: node tests/photoreal.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/dossier-ui.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/intro.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/incursions.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/incursion-growth.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/tap-rewards.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/observation.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/contamination-ui.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/conversation-pages.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/menu-pages.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/investigation-loop.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/anomaly-cues.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/account-catalog.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/rumor-patrol.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/legend-cases.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/player-seepage.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/quieter-loop.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/incursion-records.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/incursion-images.cjs
      - run: node tests/incursion-experiences.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/incursion-catalog.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/opening-reading.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/scene-fit-variety.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/screen-purpose.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/patrol-ui.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/information-ui.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/layout.cjs
        env:
          QA_FONT: ${{ runner.temp }}/noto.otf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photoreal-browser-qa
          path: |
            docs/qa/
            docs/qa-ui/
            docs/qa-intro/
            docs/qa-incursions/

  webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps webkit
      - name: Japanese font
        run: curl --fail --location --retry 2 --output "$RUNNER_TEMP/noto.otf" https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf
      - run: node tests/account-catalog.cjs
        env:
          QA_WEBKIT: 1
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/rumor-patrol.cjs
        env:
          QA_WEBKIT: 1
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/legend-cases.cjs
        env:
          QA_WEBKIT: 1
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: xvfb-run -a node tests/player-seepage.cjs
        env:
          QA_HEADED: 1
          QA_WEBKIT: 1
          QA_FONT: ${{ runner.temp }}/noto.otf
      - run: node tests/quieter-loop.cjs
        env:
          QA_WEBKIT: 1
          QA_FONT: ${{ runner.temp }}/noto.otf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-loop-qa
          path: docs/qa-incursions/

  security-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-save --package-lock=false firebase-tools@14.20.0 @firebase/rules-unit-testing@4.0.1 firebase@11.10.0
      - run: npx firebase emulators:exec --only firestore --project demo-shinso-security 'node tests/firestore-rules.cjs'
