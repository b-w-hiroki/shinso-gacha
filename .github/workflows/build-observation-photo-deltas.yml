name: build observation photo deltas
on:
  push:
    branches:
      - 'feat/observation-photo-deltas-*'
    paths:
      - 'scripts/build-observation-photo-deltas.py'
      - '.github/workflows/build-observation-photo-deltas.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-photo-deltas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0 numpy==2.2.6
      - name: Build image-relative WebP anomalies from committed original photo masters
        run: python scripts/build-observation-photo-deltas.py
      - name: Render reference montages of all four scenes
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          from pathlib import Path
          base=Path('assets/observation')
          scenes={'cctv':'cctv-underground-native.webp','photo':'photo-classroom-native.webp','vision':'vision-crossing-native.webp','dash':'dash-coast-road-native.webp'}
          w,h=560,280
          out=Image.new('RGB',(w*4,h*4),'#101212')
          for row,(mode,file) in enumerate(scenes.items()):
              master=Image.open(base/file).convert('RGBA')
              for col,r in enumerate([0,1,2,3]):
                  img=master.copy()
                  if r:img=Image.alpha_composite(img,Image.open(base/'photo-deltas'/f'{mode}-{r}.webp').convert('RGBA'))
                  img=ImageOps.fit(img.convert('RGB'),(w,h))
                  out.paste(img,(col*w,row*h))
          Path('docs/qa-incursions').mkdir(exist_ok=True,parents=True)
          out.save('docs/qa-incursions/photo-deltas-grid.jpg',quality=89)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: observation-photo-deltas-generated
          path: |
            assets/observation/photo-deltas/
            assets/observation/*-native.webp
            docs/qa-incursions/photo-deltas-grid.jpg
  commit-photo-deltas:
    if: github.event_name == 'push'
    needs: build-photo-deltas
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: observation-photo-deltas-generated
          path: ./
      - name: Commit binary photo evidence to same feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/observation/photo-deltas/
          git diff --cached --quiet || (git commit -m "art(observation): integrate 12 photo-native WebP deltas" && git push origin HEAD:"$GITHUB_REF")
